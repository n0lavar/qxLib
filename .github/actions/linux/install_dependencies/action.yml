name: Install dependencies
description: "Installs Linux dependencies required for building and testing the project."
inputs:
  cxx_flags:
    required: false
  cxx_linker_flags:
    required: false
  build_type:
    required: true
outputs:
  BOOST_ROOT:
    value: ${{ steps.install_boost.outputs.BOOST_ROOT }}
runs:
  using: composite
  steps:
    - name: Install gdb
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gdb

    - name: Install glm
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get install libglm-dev;
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install glm;
        fi

    - name: Install gtest
      shell: bash
      # build gtest manually because the apt-get version is built with an old c++ version
      # and fails to compile with -fkeep-inline-functions
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get remove libgtest-dev
          sudo apt-get install cmake git build-essential

          pushd ..
          git clone https://github.com/google/googletest.git
          cd googletest
          mkdir build && cd build
          cmake \
            .. \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ inputs.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ inputs.cxx_linker_flags }}" \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
          make -j$(nproc)
          sudo make install
          popd
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install googletest;
        fi
  
    - name: Install boost
      uses: MarkusJx/install-boost@main
      id: install_boost
      with:
        boost_version: 1.81.0

      # build benchmark manually because the apt-get version is built with an old c++ version
      # and fails to compile when using some new features
    - name: Install google benchmark
      shell: bash
      run: |
        sudo apt-get remove libbenchmark-dev
        sudo apt-get install cmake git build-essential

        pushd ..
        git clone https://github.com/google/benchmark.git
        cd benchmark
        mkdir build && cd build
        cmake \
          .. \
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
          -DCMAKE_CXX_FLAGS="${{ inputs.cxx_flags }}" \
          -DCMAKE_EXE_LINKER_FLAGS="${{ inputs.cxx_linker_flags }}" \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DBENCHMARK_ENABLE_GTEST_TESTS=OFF
        make -j$(nproc)
        sudo make install
        popd

    - name: Install fmt
      shell: bash
      run: |
        pushd ..
        git clone https://github.com/fmtlib/fmt.git
        popd
