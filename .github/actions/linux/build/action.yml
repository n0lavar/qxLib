name: Build
description: "Builds the Linux project using CMake with specified build type and options."
inputs:
  cxx_flags:
    required: false
  cxx_linker_flags:
    required: false
  build_type:
    required: true
  BOOST_ROOT:
    required: true
runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: |
        cd build
        cmake \
          .. \
          -DCMAKE_CXX_FLAGS="${{ inputs.cxx_flags }}" \
          -DCMAKE_EXE_LINKER_FLAGS="${{ inputs.cxx_linker_flags }}" \
          -DBOOST_ROOT=${{ inputs.BOOST_ROOT }} \
          -DGENERATE_TESTS=1 \
          -DGENERATE_BENCHMARKS=1
        cmake --build . --config ${{ inputs.build_type }} -j $(nproc)
