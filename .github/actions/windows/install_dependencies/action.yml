name: Install dependencies
description: "Installs Windows dependencies required for building and testing the project."
inputs:
  cxx_flags:
    required: false
  cxx_linker_flags:
    required: false
  build_type:
    required: true
  msvc_runtime_library:
    required: true

outputs:
  BOOST_ROOT:
    value: ${{ steps.install_boost.outputs.BOOST_ROOT }}
    
runs:
  using: composite        
  steps:
    - name: Install glm
      shell: cmd
      run: |
        cd
        pushd ..
        git clone https://github.com/g-truc/glm.git
        popd

    - name: Install gtest
      shell: cmd
      run: |
        cd
        pushd ..
        
        # install gtest
        git clone https://github.com/google/googletest.git
        cd googletest
        mkdir build
        cd build
        cmake ^
          .. ^
          -DCMAKE_CXX_FLAGS="${{ inputs.cxx_flags }}" ^
          -DCMAKE_EXE_LINKER_FLAGS="${{ inputs.cxx_linker_flags }}" ^
          -DCMAKE_CXX_STANDARD=20 ^
          -DCMAKE_CXX_STANDARD_REQUIRED=ON ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY="${{ inputs.msvc_runtime_library }}"
        cmake --build . --config ${{ inputs.build_type }} -j %NUMBER_OF_PROCESSORS%

        popd

    - name: Install boost
      uses: MarkusJx/install-boost@main
      id: install_boost
      with:
        boost_version: 1.81.0

    - name: Install google benchmark
      shell: cmd
      run: |
        cd
        pushd ..

        git clone https://github.com/google/benchmark.git
        cd benchmark
        mkdir build
        cd build
        cmake ^
          .. ^
          -DCMAKE_CXX_FLAGS="${{ inputs.cxx_flags }} /EHsc" ^
          -DCMAKE_EXE_LINKER_FLAGS="${{ inputs.cxx_linker_flags }}" ^
          -DCMAKE_CXX_STANDARD=20 ^
          -DCMAKE_CXX_STANDARD_REQUIRED=ON ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY="${{ inputs.msvc_runtime_library }}" ^
          -DBENCHMARK_ENABLE_GTEST_TESTS=OFF
        cmake --build . --config ${{ inputs.build_type }} -j %NUMBER_OF_PROCESSORS%

        popd
