name: Run tests
description: "Runs the test suites using ctest."
inputs:
  build_type:
    required: true
runs:
  using: composite
  steps:
    - name: Run tests
      shell: cmd
      working-directory: build
      run: |
        ctest -C ${{ inputs.build_type }} --no-tests=error --output-on-failure -j %NUMBER_OF_PROCESSORS%
